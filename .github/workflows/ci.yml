name: CI

# Roda a suíte + lint em push/PR na main. A publicação no servidor Magalu é
# manual via Docker Compose: push não faz deploy. Conferir este check antes de publicar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest tests/ -q
