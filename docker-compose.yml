# Docker Compose para RLM MCP Server
# Compatível com Dokploy + Traefik
#
# Expõe servidor HTTP/SSE na porta 8765
# Configure no Traefik para HTTPS via domínio

services:
  rlm-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    # NÃO usar container_name - causa conflitos no Dokploy
    # container_name: rlm-mcp-server

    restart: unless-stopped

    environment:
      # Memória máxima para variáveis (em MB)
      - RLM_MAX_MEMORY_MB=${RLM_MAX_MEMORY_MB:-1024}
      # Porta HTTP
      - RLM_PORT=8765
      # API Key (opcional, mas recomendado em produção)
      - RLM_API_KEY=${RLM_API_KEY:-}
      # Sub-chamadas LLM (RLM - Recursive Language Model)
      # Provider OpenAI-compat: setar DEEPSEEK_API_KEY + RLM_LLM_BASE_URL para DeepSeek;
      # senão usa OPENAI_API_KEY com endpoint padrão da OpenAI.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - RLM_LLM_BASE_URL=${RLM_LLM_BASE_URL:-}
      - RLM_SUB_MODEL=${RLM_SUB_MODEL:-gpt-4o-mini}
      - RLM_MAX_SUB_CALLS=${RLM_MAX_SUB_CALLS:-100}
      # Mistral OCR para PDFs escaneados
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Minio/S3 para carregar arquivos grandes
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_SECURE=${MINIO_SECURE:-true}
      # Response verbosity (compact|normal|verbose)
      - RLM_RESPONSE_VERBOSITY=${RLM_RESPONSE_VERBOSITY:-compact}
      # GC cleanup strategy (weighted|lru|lfu|size)
      - RLM_CLEANUP_STRATEGY=${RLM_CLEANUP_STRATEGY:-weighted}
      # Async tasks (max concurrent workers)
      - RLM_MAX_CONCURRENT_TASKS=${RLM_MAX_CONCURRENT_TASKS:-3}
      # Batch S3 operations (max parallel workers)
      - RLM_BATCH_MAX_WORKERS=${RLM_BATCH_MAX_WORKERS:-4}
      # Embedding mode for vector search (openai|disabled)
      - RLM_EMBEDDING_MODE=${RLM_EMBEDDING_MODE:-openai}
      # Rebaixa chunks de bibliografia/cabeçalho na busca semântica. Multiplicador
      # de score em [0,1]; default 1.0 = desligado (produção byte-idêntica). Flipar
      # p/ ~0.6 só após validar live que melhora sem regredir prosa limpa.
      - RLM_BOILERPLATE_PENALTY=${RLM_BOILERPLATE_PENALTY:-1.0}
      # Lockdown B2 do sandbox (Landlock FS + seccomp rede) aplicado por-filho.
      # Default 'warn' (degrada p/ B1 + WARNING se indisponível). Flipar p/
      # 'required' (fail-closed) só após validar live que engata. off = break-glass.
      - RLM_SANDBOX_LOCKDOWN=${RLM_SANDBOX_LOCKDOWN:-warn}
      # Diretório de persistência SQLite
      - RLM_PERSIST_DIR=/persist

    volumes:
      # Monte seus dados aqui - serão acessíveis via /data no container
      - rlm-data:/data:ro
      # Volume para persistência SQLite (variáveis + índices)
      - rlm-persist:/persist

    # Expõe porta
    ports:
      - "8765:8765"

    # Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - dokploy-network

    # Labels para Traefik
    # RECOMENDADO: Configurar domínio pela UI do Dokploy (aba Domains)
    # Dokploy adiciona labels automaticamente durante deploy
    # Labels abaixo são fallback caso UI não esteja configurada
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.rlm-mcp.loadbalancer.server.port=8765"

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Comando: HTTP server
    command: ["python", "-m", "rlm_mcp.http_server"]

volumes:
  rlm-data:
    driver: local
  rlm-persist:
    driver: local

networks:
  dokploy-network:
    external: true
